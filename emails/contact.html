<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title></title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style type="text/css">
            body { margin:0;padding:0;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%; }
            table, td { border-collapse:collapse;mso-table-lspace:0pt;mso-table-rspace:0pt; }
            img { border:0;height:auto;line-height:100%; outline:none;text-decoration:none;-ms-interpolation-mode:bicubic; }
            p { display:block;margin:13px 0; }
        </style>
        <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,700" rel="stylesheet" type="text/css">
        <link href="https://fonts.googleapis.com/css?family=Ubuntu:300,400,500,700" rel="stylesheet" type="text/css">
        <link href="https://fonts.googleapis.com/css?family=Cabin:400,700" rel="stylesheet" type="text/css">
        <style type="text/css">
            @import url(https://fonts.googleapis.com/css?family=Open+Sans:400,700);
            @import url(https://fonts.googleapis.com/css?family=Ubuntu:300,400,500,700);
            @import url(https://fonts.googleapis.com/css?family=Cabin:400,700);
        </style>
        <style type="text/css">
            @media only screen and (min-width:480px) {
                .mj-column-per-100 { width:100% !important; max-width: 100%; }
            }
        </style>
        <style media="screen and (min-width:480px)">
            .moz-text-html .mj-column-per-100 { width:100% !important; max-width: 100%; }
        </style>
        <style type="text/css">
            @media only screen and (max-width:479px) {
                table.mj-full-width-mobile { width: 100% !important; }
                td.mj-full-width-mobile { width: auto !important; }
            }
        </style>
        <style type="text/css">
            .hide_on_mobile { display: none !important;} 
            @media only screen and (min-width: 480px) { .hide_on_mobile { display: block !important;} }
            .hide_section_on_mobile { display: none !important;} 
            @media only screen and (min-width: 480px) { 
                .hide_section_on_mobile { 
                    display: table !important;
                } 

                div.hide_section_on_mobile { 
                    display: block !important;
                }
            }
            .hide_on_desktop { display: block !important;} 
            @media only screen and (min-width: 480px) { .hide_on_desktop { display: none !important;} }
            .hide_section_on_desktop { 
                display: table !important;
                width: 100%;
            } 
            @media only screen and (min-width: 480px) { .hide_section_on_desktop { display: none !important;} }
            p, h1, h2, h3 {
                margin: 0px;
            }
            ul, li, ol {
                font-size: 11px;
                font-family: Ubuntu, Helvetica, Arial;
            }
            a {
                text-decoration: none;
                color: inherit;
            }
            @media only screen and (max-width:480px) {
                .mj-column-per-100 { width:100%!important; max-width:100%!important; }.mj-column-per-100 > .mj-column-per-100 { width:100%!important; max-width:100%!important; }
            }
            .mj-column-per-100 [class^="mj-column-per-"] {
                line-height: normal;
            }
            .mj-button-full a {
                display: block !important;
            }
        </style>
    </head>
    <body style="word-spacing:normal;background-color:#FFFFFF;">
        <div style="background-color:#FFFFFF;">
            <!--[if mso | IE]></td></tr></table><table align="center" border="0" cellpadding="0" cellspacing="0" class="" role="presentation" style="width:600px;" width="600" bgcolor="#E7F2FC" ><tr><td style="line-height:0px;font-size:0px;mso-line-height-rule:exactly;"><![endif]-->
            <div style="background:#E7F2FC;background-color:#E7F2FC;margin:0px auto;max-width:600px;">
                <table align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="background:#E7F2FC;background-color:#E7F2FC;width:100%;">
                    <tbody>
                        <tr>
                            <td style="direction:ltr;font-size:0px;padding:0px 0px 0px 0px;text-align:center;">
                                <!--[if mso | IE]><table role="presentation" border="0" cellpadding="0" cellspacing="0"><tr><td class="" style="vertical-align:top;width:600px;" ><![endif]-->
                                <div class="mj-column-per-100 mj-outlook-group-fix" style="font-size:0px;text-align:left;direction:ltr;display:inline-block;vertical-align:top;width:100%;">
                                    <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="vertical-align:top;" width="100%">
                                        <tbody>
                                                <tr>
                                                    <td align="left" style="font-size:0px;padding:15px 15px 15px 15px;word-break:break-word;">
                                                        <div style="font-family:Ubuntu, Helvetica, Arial, sans-serif;font-size:13px;line-height:1.5;text-align:left;color:#000000;"><p style="font-family: Ubuntu, Helvetica, Arial; font-size: 11px;"><a href="https://www.google.com/" target="_blank" rel="noopener" style="color: #0000EE;"><span style="font-size: 20px;"><strong><span style="font-family: 'Open Sans', sans-serif; color: rgb(42, 62, 94);"><span style="color: rgb(74, 98, 129);">New contact form submission. </span><br></span></strong></span></a></p></div>
                                                    </td>
                                                </tr>
                                        </tbody>
                                    </table>
                                </div>
                                <!--[if mso | IE]></td></tr></table><![endif]-->
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <!--[if mso | IE]></td></tr></table><table align="center" border="0" cellpadding="0" cellspacing="0" class="" role="presentation" style="width:600px;" width="600" bgcolor="#FFFFFF" ><tr><td style="line-height:0px;font-size:0px;mso-line-height-rule:exactly;"><![endif]-->
            <div style="background:#FFFFFF;background-color:#FFFFFF;margin:0px auto;max-width:600px;">
                <table align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="background:#FFFFFF;background-color:#FFFFFF;width:100%;">
                    <tbody>
                        <tr>
                            <td style="direction:ltr;font-size:0px;padding:10px 0px 10px 0px;text-align:center;">
                                <!--[if mso | IE]><table role="presentation" border="0" cellpadding="0" cellspacing="0"><tr><td class="" style="vertical-align:top;width:600px;" ><![endif]-->
                                <div class="mj-column-per-100 mj-outlook-group-fix" style="font-size:0px;text-align:left;direction:ltr;display:inline-block;vertical-align:top;width:100%;">  
                                    <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="vertical-align:top;" width="100%">
                                        <tbody>
                                                <tr>
                                                    <td align="left" style="font-size:0px;padding:15px 15px 15px 15px;word-break:break-word;">
                                                        <div style="font-family:Ubuntu, Helvetica, Arial, sans-serif;font-size:13px;line-height:1.5;text-align:left;color:#000000;">
                                                        <p style="font-family: Ubuntu, Helvetica, Arial; font-size: 11px; margin-bottom: 15px;">
                                                            <span style="font-family: 'Open Sans', sans-serif; font-size: 16px;">
                                                                <span style="font-family: 'Open Sans', sans-serif; font-size: 16px; font-weight: 600;">
                                                                    <!--$name-->
                                                                </span> 
                                                                with email 
                                                                <a href="mailto:<!--$email-->">
                                                                    <!--$email-->
                                                                </a>
                                                            </span>
                                                        </p>
                                                        <p style="font-family: Ubuntu, Helvetica, Arial; font-size: 18px; font-weight: 600;">Wrote:</p>
                                                        <!--foreach($paragraphs as $paragraph)-->
                                                            <p style="font-family: Ubuntu, Helvetica, Arial; font-size: 16px; margin: 0; margin-bottom: 15px;"><!--$paragraph--></p>
                                                        <!--endforeach-->
                                                        </div>
                                                    </td>
                                                </tr>                      
                                        </tbody>
                                    </table>
                                </div>
                                <!--[if mso | IE]></td></tr></table><![endif]-->
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </body>
</html>
